# 服务端镜像用到的模型（v6 C6）：每个文件的 sha256、大小、在本仓库 Release 里的名字、放到哪、原发布方。
# scripts/fetch-models.sh 读这个文件；来源与许可证见同目录的 MODELS.md。
#
# 为什么有自己的 Release：原发布方（GitHub Release、Hugging Face）随时可能删文件或换内容 ⇒
#   第一次从原发布方下载、按这里的 sha256 校验后，传到本仓库的 Release（下面 release 那一行的标签）留底；
#   之后构建镜像只从本仓库的 Release 下载，同样按 sha256 校验。
# 换模型：改这里（新的 sha256 / 大小 / 地址），release 改成下一个标签（models-v2），提交后推这个标签（或在 Actions 页面
#   手动运行 models）⇒ .github/workflows/models.yml 从原发布方下载、校验，建好新的 Release。旧的 Release 不动（旧镜像仍能重建）。
#
# 格式：release 一行；之后每行一个文件，空白分隔 ——
#   sha256  大小(字节)  Release 里的文件名  放到哪（models 构建上下文里的相对路径，Dockerfile 按它拷）  原发布方地址  压缩包里的路径（不是压缩包写 -）
release models-v1

