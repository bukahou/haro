          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/invites/{inviteId}:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    delete:
      tags: [admin]
      operationId: revokeInvite
      summary: 撤销一个还没用的邀请码（用过、撤销过的回 404）
      responses:
        '204':
          description: 撤销了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/terminals/pending:
    get:
      tags: [admin]
      operationId: listPendingTerminals
      summary: 等待批准的新终端
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 新终端（先来的在前）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingTerminal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/terminals/pending/{terminalId}/approve:
    parameters:
      - $ref: '#/components/parameters/TerminalId'
    post:
      tags: [admin]
      operationId: approveTerminal
      summary: 批准新终端（它成为一个匿名账号的终端；它的月上限给那个账号定：updateAccount）
      responses:
        '204':
          description: 已批准
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/terminals/pending/{terminalId}/reject:
    parameters:
      - $ref: '#/components/parameters/TerminalId'
    post:
      tags: [admin]
      operationId: rejectTerminal
      summary: 拒绝新终端
      responses:
        '204':
          description: 已拒绝
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: haro 发的访问令牌（不是 akasha 的）
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 给人看的文字（说明、标签）用的语言；不带时用中文
      schema:
        type: string
        maxLength: 100
    EditScope:
      name: scope
      in: query
      required: false
      description: 重复的日程改、删哪些：all（整个系列，默认）、this（只这一次）、future（这一次和以后）；this、future 要带 occurrence
      schema:
        type: string
        enum: [all, this, future]
    OccurrenceStart:
      name: occurrence
      in: query
      required: false
      description: scope 是 this、future 时，是哪一次（那一次的开始时间，occurrences 给的 start）
      schema:
        type: string
        format: date-time
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: 对话的编号；语音那条是 `voice`
      schema:
        type: string
        maxLength: 64
    TerminalId:
      name: terminalId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    Month:
      name: month
      in: query
      description: 哪个月（YYYY-MM，按服务端的时区）；不带 = 这个月
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
  responses:
    Unauthorized:
      description: 没登录、令牌无效或过期（`code` 区分）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 没有权限（例如不是管理员）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 没有这个东西（或不是这个账号的）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: 请求不符合契约或业务规则
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 状态不允许（例如配对码已被用过）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 太频繁，稍后再试
      headers:
        Retry-After:
          description: 多少秒后再试
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ErrorCode:
      type: string
      description: |
        稳定的错误码（App 按它判断，不看文字）。not_implemented = 这个接口契约里有、服务端还没做（HTTP 501；分批上线时出现）
      enum:
        - unauthorized
        - token_expired
        - invalid_token
        - forbidden
        - not_found
        - validation_failed
        - conflict
        - rate_limited
        - pending_approval
        - account_disabled
        - pairing_code_invalid
        - pairing_code_expired
        - pairing_attempts_exceeded
        - upgrade_required
        - not_implemented
        - generation_failed
        - internal
    OidcError:
      type: string
      description: 登录失败时 `haro://auth/callback?oidc_error=` 的值
      enum:
        - pending_approval
        - account_disabled
        - invite_invalid
        - login_cancelled
        - login_failed
    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: 问题类型的 URI（`about:blank` 或 haro 的文档地址）
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: 给人看的说明（按 Accept-Language）
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 200
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: 访问令牌还有多少秒过期
        token_type:
          type: string
          enum: [Bearer]
    Money:
      type: object
      description: 金额：数值（十进制字符串，按币种的最小单位）+ 币种
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          example: '3000'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: JPY
    MoneyTotal:
      type: object
      description: 换成默认货币的合计，带换算提示
      required: [total, by_currency]
      properties:
        total:
          $ref: '#/components/schemas/Money'
        by_currency:
          type: array
          description: 换算前按币种分开的合计
          items:
            $ref: '#/components/schemas/Money'
        conversion_note:
          type: string
          nullable: true
          description: 有换算时给人看的提示（几种币种、哪天的汇率）；没换算时为 null
        rate_date:
          type: string
          format: date
          nullable: true
    ReceiptStatus:
      type: string
      description: parsing = 在解析；ready = 解析好了，等确认；failed = 解析失败（看 failure）；confirmed = 已经入账（看 expense_id）
      enum: [parsing, ready, failed, confirmed]
    ReceiptFailure:
      type: string
      description: unreadable = 看不出是小票、或者看不清（重拍）；unavailable = 模型暂时用不了（稍后重交）
      enum: [unreadable, unavailable]
    ReceiptField:
      type: string
      description: 草稿里的一个字段（看不清、拿不准的标出来）
      enum: [merchant, spent_at, currency, items, subtotal, tax, total, payment_method]
    Receipt:
      type: object
      required: [receipt_id, status, created_at]
      properties:
        receipt_id:
          type: string
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        draft:
          description: 解析出的草稿（解析好了以后有；确认后是确认时交的）
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExpenseDraft'
        failure:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReceiptFailure'
        failure_message:
          type: string
          nullable: true
          description: 解析失败时给人看的说明（按语言）
        expense_id:
          type: string
          nullable: true
          description: 入账以后是那笔账
        created_at:
          type: string
          format: date-time
    ExpenseDraft:
      type: object
      description: 解析出的草稿：金额都是十进制写法（不带货币符号），确认时可以改任何一项再交回（ExpenseInput）
      required: [merchant, currency, items, total, uncertain]
      properties:
        merchant:
          type: string
        spent_at:
          type: string
          format: date-time
          nullable: true
          description: 读不出时为 null（uncertain 里有 spent_at）
        currency:
          type: string
          description: ISO 4217；读不出时为空
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItemInput'
        subtotal:
          type: string
          nullable: true
        tax:
          type: string
          nullable: true
        total:
          type: string
        payment_method:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          description: 建议的分类键（主人上传时点过的用主人的）
        note:
          type: string
          nullable: true
        uncertain:
          type: array
          description: 看不清、拿不准的字段（App 标出来请主人核对）
          items:
            $ref: '#/components/schemas/ReceiptField'
    ExpenseItemInput:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: string
          maxLength: 32
          description: 十进制写法
        unit_price:
          type: string
          maxLength: 32
        amount:
          type: string
          maxLength: 32
        tax_rate:
          type: string
          maxLength: 16
          description: 税率的百分比（例如 8、10）
    ExpenseInput:
      type: object
      description: 一笔账（手记、确认小票、改账目都用它）：金额是十进制写法，币种 ISO 4217，明细的金额和合计同一种币种
      required: [merchant, spent_at, currency, total]
      properties:
        merchant:
          type: string
          minLength: 1
          maxLength: 200
        spent_at:
          type: string
          format: date-time
        currency:
          type: string
          minLength: 3
          maxLength: 3
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExpenseItemInput'
        subtotal:
          type: string
          maxLength: 32
        tax:
          type: string
          maxLength: 32
        total:
          type: string
          minLength: 1
          maxLength: 32
        payment_method:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 64
          description: 分类键（listExpenseCategories）；不带 = 不分类
        note:
          type: string
          maxLength: 1000
    ExpenseItem:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
        quantity:
          type: string
          nullable: true
        unit_price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
        tax_rate:
          type: string
          nullable: true
    Expense:
      type: object
      required: [expense_id, merchant, spent_at, total, items, has_image, created_at, updated_at]
      properties:
        expense_id:
          type: string
        merchant:
          type: string
        spent_at:
          type: string
          format: date-time
        total:
          $ref: '#/components/schemas/Money'
        subtotal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
        tax:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
        payment_method:
          type: string
          nullable: true
        category:
          description: 没分类时为 null；自己加的分类删了以后 name 是「已删的分类」
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExpenseCategory'
        note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItem'
        has_image:
          type: boolean
          description: 有原图（getExpenseImage）；手记的没有
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExpenseCategory:
      type: object
      required: [key, name, builtin]
      properties:
        key:
          type: string
        name:
          type: string
          description: 给人看的名字（固定的几类按语言）
        builtin:
          type: boolean
          description: 固定的几类（删不了）
    ExpenseCategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    ExpenseGroup:
      type: object
      description: 汇总里的一组（一个分类或一家店）
      required: [name, count, total, share]
      properties:
        key:
          type: string
          nullable: true
          description: 分类的键（按分类的组；没分类的那组为 null）；按店的组为 null
        name:
          type: string
          description: 给人看的名字（分类名、「未分类」或店名）
        count:
          type: integer
        total:
          $ref: '#/components/schemas/MoneyTotal'
        share:
          type: number
          minimum: 0
          maximum: 1
          description: 占这个月合计的比例（都换成默认货币以后；没算进合计的币种不算）
    ExpenseSummary:
      type: object
      required: [month, count, total, previous, categories, merchants]
      properties:
        month:
          type: string
          description: YYYY-MM
        count:
          type: integer
          description: 这个月几笔
        total:
          $ref: '#/components/schemas/MoneyTotal'
        previous:
          description: 上个月的合计（比较用）
          allOf:
            - $ref: '#/components/schemas/MoneyTotal'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseGroup'
        merchants:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseGroup'
    AccountUpdate:
      type: object
      required: [monthly_cap]
      properties:
        monthly_cap:
          description: 月上限（币种必须是服务端的默认货币，大于 0；可选的档位在 client-config 的 monthly_cap_options）；null = 不设
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
    InviteStatus:
      type: string
      description: unused = 还没用；used = 用过了（used_by_name 是谁）；expired = 过期了；revoked = 撤销了
      enum: [unused, used, expired, revoked]
    Invite:
      type: object
      required: [invite_id, status, created_at, expires_at]
      properties:
        invite_id:
          type: string
        note:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/InviteStatus'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true
        used_by_name:
          type: string
          nullable: true
          description: 用它进来的账号的显示名（那个账号彻底删了以后为 null）
    InviteInput:
      type: object
      properties:
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: 多少小时后过期；不带 = 168（7 天）
        note:
          type: string
          maxLength: 200
          description: 备注（给谁的）
    CreatedInvite:
      type: object
      required: [invite, code]
      properties:
        invite:
          $ref: '#/components/schemas/Invite'
        code:
          type: string
          description: 邀请码（显示形式，例如 ABCD-EFGH-JKMN；只给这一次）。登录时作为 startLogin 的 invite 参数
        share_url:
          type: string
          nullable: true
          description: 发给对方的登录地址（浏览器打开就用这个码登录、登录完到网页版）；没有网页版时为 null
    ClientConfig:
      type: object
      required: [server_version, api_version, min_app_version, limits, calendar_alert_options]
      properties:
        server_version:
          type: string
        api_version:
          type: string
          description: 这份契约的版本号
        min_app_version:
          type: string
          description: 支持的最低 App 版本；更旧时提示更新
        limits:
          $ref: '#/components/schemas/Limits'
        monthly_cap_options:
          type: array
          description: 管理员给账号 / 终端定月上限时的可选档位（默认货币）
          items:
            $ref: '#/components/schemas/Money'
        calendar_alert_options:
          type: array
          description: 新建 / 改日程时给主人选的提醒档位（提前多少秒，0 = 到点时；少的在前）。EventInput.alerts 不限于这几个
          items:
            type: integer
            minimum: 0
    Limits:
      type: object
      required: [profile_max_chars, display_name_max_chars, terminal_name_max_chars, page_size, attachment_max_bytes,
        calendar_sync_days_back, calendar_sync_days_ahead]
      properties:
        attachment_max_bytes:
          type: integer
          description: 上传的一张图片最多多少字节
        calendar_sync_days_back:
          type: integer
          description: 同步系统日历时往前交多少天的日程
        calendar_sync_days_ahead:
          type: integer
          description: 同步系统日历时往后交多少天的日程
        profile_max_chars:
          type: integer
        display_name_max_chars:
          type: integer
        terminal_name_max_chars:
          type: integer
        page_size:
          type: integer
    Role:
      type: string
      enum: [admin, member]
    AccountStatus:
      type: string
      enum: [active, pending_approval, disabled]
    JoinedVia:
      type: string
      enum: [admin, invite, approval, terminal]
    Me:
      type: object
      required: [account_id, display_name, role, status, default_currency, created_at]
      properties:
        account_id:
          type: string
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        default_currency:
          type: string
          pattern: '^[A-Z]{3}$'
        created_at:
          type: string
          format: date-time
    MeUpdate:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        default_currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Overview:
      type: object
      required: [account, terminals, memory, research, spending]
      properties:
        account:
          type: object
          description: 登录的这个账号（「我的」页头部用，不用再调 /api/v1/me）
          required: [display_name, role]
          properties:
            display_name:
              type: string
            role:
              $ref: '#/components/schemas/Role'
        terminals:
          type: object
          required: [total, online, needs_upgrade]
          properties:
            total:
              type: integer
            online:
              type: integer
            needs_upgrade:
              type: integer
        memory:
          type: object
          required: [background_items, resident, notes]
          properties:
            background_items:
              type: integer
            resident:
              type: integer
            notes:
              type: integer
        research:
          type: object
          required: [running]
          properties:
            running:
              type: integer
        spending:
          $ref: '#/components/schemas/MonthSpending'
        admin:
          type: object
          nullable: true
          description: 管理员才有
          required: [pending_terminals, pending_accounts]
          properties:
            pending_terminals:
              type: integer
            pending_accounts:
              type: integer
    Profile:
      type: object
      description: |
        主人资料（Markdown，每次对话都会带给 haro）。⛔ 不写密码、银行卡和账户号、证件号码、验证码和密钥。
        `<!-- -->` 注释（填写说明）、没填的项不会发给 haro。
      required: [household, owner, max_chars, updated_at]
      properties:
        household:
          type: string
          description: 全家：这个家里的人都会带上（终端认不出是谁时也带上）
        owner:
          type: string
          description: 本人：认出是账号本人时才带上
        max_chars:
          type: integer
          description: 每一段最多多少字
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: null = 还没在 App 里改过（管理员账号这时显示的是服务端配置里的资料文件）
    ProfileUpdate:
      type: object
      required: [household, owner]
      properties:
        household:
          type: string
          maxLength: 10000
        owner:
          type: string
          maxLength: 10000
    Place:
      type: object
      required: [name, latitude, longitude]
      properties:
        name:
          type: string
          description: 区 / 市的名字（按 Accept-Language）
        region:
          type: string
          nullable: true
          description: 上一级（都道府县、州、省）
        country:
          type: string
          nullable: true
          description: 国家名
        country_code:
          type: string
          nullable: true
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 两位代码（只知道坐标时为 null）
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Home:
      type: object
      required: [place, holidays_country, updated_at]
      properties:
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: null = 还没在 App 里设过（管理员账号这时显示的是服务端配置里的家）
        place:
          allOf:
            - $ref: '#/components/schemas/Place'
          nullable: true
          description: 没设时为 null（问天气时要说地名）
        holidays_country:
          type: string
          nullable: true
          pattern: '^[A-Z]{2}$'
          description: 告诉 haro 哪个国家的节假日；null = 不告诉
    HomeUpdate:
      type: object
      required: [place, holidays_country]
      properties:
        place:
          allOf:
            - $ref: '#/components/schemas/Place'
          nullable: true
        holidays_country:
          type: string
          nullable: true
          pattern: '^[A-Z]{2}$'
    Country:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[A-Z]{2}$'
        name:
          type: string
          description: 按 Accept-Language
    SpendingStatus:
      type: string
      description: ok = 正常；near = 快到上限（提醒）；reached = 到了上限（暂停回答）
      enum: [ok, near, reached]
    MonthSpending:
      type: object
      required: [spent, status, can_raise, used_ratio]
      properties:
        used_ratio:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: 用了上限的几成（0–1，超过上限时是 1；进度条直接用）；不设上限时为 null
        spent:
          $ref: '#/components/schemas/MoneyTotal'
        cap:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: 这个月的上限（含口头提高的）；null = 不设上限
        remaining:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        status:
          $ref: '#/components/schemas/SpendingStatus'
        can_raise:
          type: boolean
          description: 到上限后能不能口头临时提高
        raise_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
    PurposeSpending:
      type: object
      required: [purpose, label, spent, share]
      properties:
        share:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 占本月合计的几成（0–1，各用途加起来是 1；本月还没花钱时都是 0）
        purpose:
          type: string
          description: 用途的代码（chat、research、search、summary、vision、strong）
        label:
          type: string
          description: 给人看的名字（按 Accept-Language）
        spent:
          $ref: '#/components/schemas/MoneyTotal'
    Spending:
      type: object
      required: [month, by_purpose, today]
      properties:
        month:
          $ref: '#/components/schemas/MonthSpending'
        by_purpose:
          type: array
          items:
            $ref: '#/components/schemas/PurposeSpending'
        today:
          type: object
          required: [research, search]
          properties:
            research:
              type: object
              required: [spent]
              properties:
                spent:
                  $ref: '#/components/schemas/MoneyTotal'
                cap:
                  allOf:
                    - $ref: '#/components/schemas/Money'
                  nullable: true
                remaining:
                  allOf:
                    - $ref: '#/components/schemas/Money'
                  nullable: true
            search:
              type: object
              required: [used]
              properties:
                used:
                  type: integer
                  description: 今天用了几个搜索积分
                cap:
                  type: integer
                  nullable: true
    ConversationKind:
      type: string
      description: voice = 语音那条（终端上说的都接在这里，App 里也能接着打字）；chat = App 里新建的
      enum: [voice, chat]
    Conversation:
      type: object
      required: [conversation_id, kind, title, incognito, last_text, updated_at]
      properties:
        conversation_id:
          type: string
        kind:
          $ref: '#/components/schemas/ConversationKind'
        title:
          type: string
          nullable: true
          description: 标题（第一轮之后后台起）；null = 还没有（语音那条的名字 App 自己写，按语言）
        incognito:
          type: boolean
          description: 无痕：不进长期记忆的检索、不进背景记录池
        last_text:
          type: string
          nullable: true
          description: 最近一轮 haro 的回答（列表里显示一行）
        updated_at:
          type: string
          format: date-time
          nullable: true
    ConversationCreate:
      type: object
      properties:
        incognito:
          type: boolean
          default: false
    TurnPage:
      type: object
      required: [turns, next_before]
      properties:
        turns:
          type: array
          items:
            $ref: '#/components/schemas/Turn'
        next_before:
          type: integer
          format: int64
          nullable: true
          description: 再往前翻时带的 before；null = 到头了
    Turn:
      type: object
      description: 一轮：主人说的一句 + haro 的回答（工具往来只给名字）
      required: [seq, at, said, reply]
      properties:
        seq:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
          nullable: true
        said:
          type: string
          nullable: true
          description: 主人说的（这一轮没有主人的话时为 null，例如 haro 到点自己开口的提醒）
        attachment:
          type: string
          nullable: true
          description: 主人这句带的图片（attachment_id，用 /attachments/{attachmentId} 取）
        reply:
          type: array
          items:
            $ref: '#/components/schemas/ReplyBlock'
    ReplyBlockType:
      type: string
      enum: [text, tool]
    ReplyBlock:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ReplyBlockType'
        text:
          type: string
          description: type = text：回答的文字（打字的对话里是 Markdown）
        tool:
          type: string
          description: type = tool：调用了哪个工具（工具的名字）
    MessageSend:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        attachment:
          type: string
          nullable: true
          maxLength: 64
          description: 这一句带的图片（先在这条对话里上传拿到的 attachment_id；先只收一张）
    ChatEventType:
      type: string
      enum: [started, text, done, failed]
    ChatEvent:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ChatEventType'
        turn_id:
          type: string
          description: started：这一轮的编号（停止时用）
        text:
          type: string
          description: text：回答的文字片段
        status:
          type: string
          enum: [completed, incomplete, cancelled]
          description: done：怎么结束的（incomplete = 到了输出上限等没说完）
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: failed：给人看的说明（按 Accept-Language）；code 是 generation_failed（模型出错）或 internal
    AttachmentInfo:
      type: object
      required: [attachment_id, width, height]
      properties:
        attachment_id:
          type: string
        width:
          type: integer
        height:
          type: integer
    FoundTurn:
      type: object
      required: [conversation_id, turn]
      properties:
        conversation_id:
          type: string
          description: 在哪条对话（语音那条是 voice）
        turn:
          $ref: '#/components/schemas/Turn'
    Backstory:
      type: object
      required: [enabled, used_chars, max_chars, items]
      properties:
        enabled:
          type: boolean
        used_chars:
          type: integer
        max_chars:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackstoryItem'
    BackstoryItem:
      type: object
      required: [item_id, text, edited, source, updated_at]
      properties:
        item_id:
          type: string
        text:
          type: string
        edited:
          type: boolean
          description: 主人改过（后台不改、不删）
        source:
          allOf:
            - $ref: '#/components/schemas/TurnRef'
          nullable: true
          description: 从哪条对话的哪一轮来；null = 不知道
        updated_at:
          type: string
          format: date-time
    TurnRef:
      type: object
      required: [conversation_id, seq]
      properties:
        conversation_id:
          type: string
        seq:
          type: integer
          format: int64
    BackstoryUpdate:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    BackstoryItemUpdate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
    NoteList:
      type: object
      required: [notes, total, forgotten]
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        total:
          type: integer
          description: 一共记了几条（notes 只给最近的一部分时比它多）
        forgotten:
          type: array
          description: 最近忘掉的（找回用）
          items:
            $ref: '#/components/schemas/Note'
    Note:
      type: object
      required: [note_id, content, resident, created_at, forgotten_at]
      properties:
        note_id:
          type: integer
          format: int64
        content:
          type: string
        resident:
          type: boolean
          description: 常驻：主人明说要记住的，每轮都带给 haro
        created_at:
          type: string
          format: date-time
        forgotten_at:
          type: string
          format: date-time
          nullable: true
    ResearchStatus:
      type: string
      enum: [queued, running, done, partial, failed, cancelled, interrupted]
    ResearchTask:
      type: object
      required: [task_id, question, status, status_label, conclusion, sources, stop_reason, created_at]
      properties:
        task_id:
          type: integer
          format: int64
        question:
          type: string
        status:
          $ref: '#/components/schemas/ResearchStatus'
        status_label:
          type: string
          description: 给人看的状态（按 Accept-Language）
        conclusion:
          type: string
          nullable: true
          description: 结论（Markdown）
        sources:
          type: array
          items:
            type: string
        stop_reason:
          type: string
          nullable: true
          description: 为什么没查完 / 为什么失败
        created_at:
          type: string
          format: date-time
    EventInput:
      type: object
      required: [title, start, end, all_day, alerts, alert_terminal, alert_phone]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        location:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 2000
        start:
          type: string
          format: date-time
          description: 全天的写那一天的 00:00Z
        end:
          type: string
          format: date-time
          description: 全天的写最后一天的第二天 00:00Z（不含）
        all_day:
          type: boolean
        rrule:
          type: string
          nullable: true
          maxLength: 500
          description: 重复规则（RFC 5545 RRULE 一行，例如 FREQ=WEEKLY;BYDAY=MO）；null = 一次
        alerts:
          type: array
          maxItems: 5
          description: 提醒：提前多少秒（0 = 到点时）
          items:
            type: integer
            minimum: 0
            maximum: 604800
        alert_terminal:
          type: boolean
          description: 在终端响（haro 说出来）
        alert_phone:
          type: boolean
          description: 在手机响（App 的本地通知）
    CalendarSource:
      type: string
      description: haro = haro 自己的（能改）；system = 从系统日历同步进来的（只读）
      enum: [haro, system]
    CalendarEvent:
      type: object
      required: [event_id, title, location, notes, start, end, all_day, rrule, alerts, alert_terminal, alert_phone, source, calendar_name, editable]
      properties:
        event_id:
          type: string
        title:
          type: string
        location:
          type: string
        notes:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        all_day:
          type: boolean
        rrule:
          type: string
          nullable: true
        alerts:
          type: array
          items:
            type: integer
        alert_terminal:
          type: boolean
        alert_phone:
          type: boolean
        source:
          $ref: '#/components/schemas/CalendarSource'
        calendar_name:
          type: string
          nullable: true
          description: 从哪个系统日历同步进来的
        editable:
          type: boolean
    Occurrence:
      type: object
      required: [event, start, end, recurring]
      properties:
        event:
          $ref: '#/components/schemas/CalendarEvent'
        start:
          type: string
          format: date-time
          description: 这一次的开始（改、删这一次时带回来）
        end:
          type: string
          format: date-time
        recurring:
          type: boolean
    PhoneAlert:
      type: object
      required: [event_id, title, occurrence_start, at, lead_seconds]
      properties:
        event_id:
          type: string
        title:
          type: string
        occurrence_start:
          type: string
          format: date-time
        at:
          type: string
          format: date-time
          description: 什么时候响
        lead_seconds:
          type: integer
    CalendarSync:
      type: object
      required: [calendar_id, name, synced_at]
      properties:
        calendar_id:
          type: string
        name:
          type: string
        synced_at:
          type: string
          format: date-time
    CalendarSyncRequest:
      type: object
      required: [name, events]
      properties:
        name:
          type: string
          maxLength: 200
          description: 系统日历的名字（显示用）
        events:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/SyncedEvent'
    SyncedEvent:
      type: object
      required: [external_id, title, start, end, all_day]
      properties:
        external_id:
          type: string
          maxLength: 300
          description: 系统给这一次的编号（重复的每一次各不相同）
        title:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 2000
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        all_day:
          type: boolean
    CalendarSyncResult:
      type: object
      required: [added, updated, removed]
      properties:
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
    TerminalNetwork:
      type: string
      description: 从哪里连进来的
      enum: [lan, internet]
    Terminal:
      type: object
      required: [terminal_id, name, online, version, needs_upgrade, network]
      properties:
        terminal_id:
          type: string
        name:
          type: string
        online:
          type: boolean
        version:
          type: string
        needs_upgrade:
          type: boolean
        upgrade_note:
          type: string
          nullable: true
          description: 怎么升级（给人看的，按 Accept-Language）
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        network:
          $ref: '#/components/schemas/TerminalNetwork'
    TerminalUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
    PairRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 终端念出来 / 显示的配对码
          minLength: 4
          maxLength: 16
    PairResult:
      type: object
      required: [terminal, merged]
      properties:
        terminal:
          $ref: '#/components/schemas/Terminal'
        suggested_name:
          type: string
          nullable: true
        merged:
          type: object
          description: 这台终端匿名期间的数据，并进了这个账号多少
          required: [conversations, reminders]
          properties:
            conversations:
              type: integer
            reminders:
              type: integer
    PendingTerminal:
      type: object
      required: [terminal_id, reported_name, short_id, requested_at, network, version]
      properties:
        terminal_id:
          type: string
        reported_name:
          type: string
          description: 终端自报的名字
        short_id:
          type: string
          description: 短编号（终端登记时也显示这个编号，对得上就是它）
        requested_at:
          type: string
          format: date-time
        network:
          $ref: '#/components/schemas/TerminalNetwork'
        version:
          type: string
    AccountSummary:
      type: object
      required: [account_id, display_name, role, status, joined_via, spent_this_month, terminals_online]
      properties:
        account_id:
          type: string
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        joined_via:
          $ref: '#/components/schemas/JoinedVia'
        spent_this_month:
          description: 这个账号自己这个月的花费（管理员那一行是管理员自己的；所有账号一起的在花费页）
          allOf:
            - $ref: '#/components/schemas/MoneyTotal'
        cap:
          description: 管理员给它定的月上限；没定、管理员自己（用全局的上限）为 null
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        terminals_online:
          type: integer
        last_used_at:
          type: string
          format: date-time
          nullable: true
        app_version:
          type: string
          nullable: true
        deletion_scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: 软删除后彻底删掉的时间（30 天后）；没删除时为 null
