# haro 终端的回声消除：PipeWire 自带的 echo-cancel 模块（WebRTC 的回声消除，和浏览器用的同一套），
# 让终端播放回答时也能听主人说话（HARO_BARGE_IN=voice：一开口就打断）。
#
# 装法（Linux 终端，PipeWire 0.3.60 以上）：
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp haro-echo-cancel.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire pipewire-pulse wireplumber
# 再在终端的配置里设 HARO_AUDIO_SOURCE=haro-echo-cancel-source、HARO_BARGE_IN=voice，重启终端。
# 卸掉：删掉这个文件、重启 PipeWire，终端配置改回去。
#
# monitor.mode：参考信号取系统默认音箱的监听口。播放照常走默认音箱（蓝牙断开重连、换音箱都不用改）；
#   不开时要把声音改送到模块建的输出才消得掉。
# 只多出一个虚拟麦克风（haro-echo-cancel-source），不设成系统默认：别的程序照旧用原来的麦克风。
# 只开回声消除和高通滤波：降噪、自动增益会改变声音，而声纹是按原始麦克风登记的。
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      aec.args = {
        webrtc.high_pass_filter = true
        webrtc.noise_suppression = false
        webrtc.gain_control = false
      }
      capture.props = {
        node.name = "haro-echo-cancel-capture"
        node.passive = true
      }
      source.props = {
        node.name = "haro-echo-cancel-source"
        node.description = "haro echo-cancelled microphone"
      }
    }
  }
]
