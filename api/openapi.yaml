      tags: [expenses]
      operationId: listReceipts
      summary: 还没入账的小票（在读的、读好了等确认的、没读成的；新的在前）
      responses:
        '200':
          description: 小票
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Receipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [expenses]
      operationId: uploadReceipt
      summary: 交一张小票、发票、收据或订单页的截图（请求体就是图片）：存好原图，开始在后台解析；之后用 getReceipt 看草稿
      description: |
        一个人同时在解析的最多 10 张（多了回 409）。交上来 30 天还没确认的小票连原图一起删掉。
      parameters:
        - name: category
          in: query
          description: 主人点的分类（分类的键，见 listExpenseCategories）
          schema:
            type: string
            maxLength: 64
        - name: note
          in: query
          description: 主人写的一句说明
          schema:
            type: string
            maxLength: 1000
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: 收下了，在解析（status = parsing）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
