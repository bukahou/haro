openapi: 3.0.3
info:
  title: haro App API
  version: 0.13.0
  description: |
    haro 手机 App 和网页版用的接口（第一批：账号、登录、我、花费、终端、管理员）。
    服务端和 App 都从这份契约生成代码；⛔ 两边都不绕过契约私下约定字段。契约每改一次升版本号。

    约定：
    - 鉴权：`Authorization: Bearer <访问令牌>`（haro 自己发的令牌，登录见 `/api/v1/auth/oidc/start`）。
    - 出错：RFC 9457（`application/problem+json`），App 按 `code` 判断，`detail` 是给人看的说明（按 `Accept-Language` 的语言）。
    - 时间：ISO 8601、UTC；App 按设备时区显示。
    - 金额：`Money`（数值是十进制字符串 + ISO 4217 币种）；汇总类是 `MoneyTotal`（换成默认货币，带换算提示）。
    - 业务参数（各种上限、可选项）由 `/api/v1/client-config` 下发，App 不写死。
    - App 请求时用 `User-Agent` 带上 App 的版本（例如 `haro-ios/1.0.0`）。
    - App 的接口都在 `/api/v1/` 下（公网只放行这一段）；`/v1/...` 是终端的语音连接，只在局域网。
    - 网页版（另一个域名）从浏览器跨域调接口：服务端只放行网页版的那一个来源（CORS），令牌同样放在 `Authorization` 里，不用 cookie。
servers:
  - url: https://haro.example.com
    description: 占位（真实地址由部署决定）
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 登录（经 haro 后端代理 akasha；App 不直接调 akasha）
  - name: me
    description: 登录的这个账号
  - name: spending
    description: 花费与上限
  - name: terminals
    description: 这个账号的终端
  - name: admin
    description: 管理员才能用（只看运维信息，看不到别人的内容）
  - name: conversations
    description: 聊天：语音那条对话和 App 里新建的对话
  - name: memory
    description: 记录：背景记录池、记过的事、后台调查
  - name: calendar
    description: 日历：haro 自己的日程和系统日历同步进来的
  - name: expenses
    description: 记账：主人自己的账目（和 haro 自己的花费账本分开）
paths:
  /api/v1/auth/oidc/start:
    get:
      tags: [auth]
      operationId: startLogin
      summary: 开始登录（浏览器跳转）
      description: |
        App 用系统的网页登录框（ASWebAuthenticationSession，回调 scheme `haro`）打开这个地址，网页版在浏览器里打开（带 `client=web`）；
        haro 跳到 akasha 登录，回来后跳回发起的一方（只有这两个固定地址）：
        - App：成功 `haro://auth/callback#access_token=…&refresh_token=…&expires_in=3600&token_type=Bearer`，
          失败 `haro://auth/callback?oidc_error=<OidcError>`
        - 网页版：同样的内容，地址换成网页版的 `/auth/callback`（`#` 后面的部分浏览器不发给服务器，网页读完立刻从地址栏清掉）
        这不是 JSON 接口。没有网页版的服务端收到 `client=web` 回 404。
      security: []
      parameters:
        - name: client
          in: query
          required: false
          description: 谁发起的登录（决定登录完跳回哪里）；不带 = `app`
          schema:
            type: string
            enum: [app, web]
        - name: invite
          in: query
          required: false
          description: 管理员发的邀请码（没有账号时用：有效的码直接是正常账号；不对、过期、用过的回 `oidc_error=invite_invalid`，不建账号）
          schema:
            type: string
            maxLength: 64
      responses:
        '302':
          description: 跳到 akasha 的登录页
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: finishLogin
      summary: akasha 登录完回来的地址（浏览器跳转，App 不直接调）
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: 跳回发起登录的一方（App 的 `haro://auth/callback` 或网页版的 `/auth/callback`，见 startLogin）
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: 用刷新令牌换新的一对（刷新令牌用一次就作废）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 新的一对令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出（作废刷新令牌）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: 已登出（令牌本来就无效时也是 204）
  /api/v1/client-config:
    get:
      tags: [me]
      operationId: getClientConfig
      summary: App 要用的业务参数（不用登录）
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: 登录的这个账号
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [me]
      operationId: updateMe
      summary: 改显示名、默认货币
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: 改后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/overview:
    get:
      tags: [me]
      operationId: getOverview
      summary: 「我的」页的摘要（一个接口给齐）
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/profile:
    get:
      tags: [me]
      operationId: getProfile
      summary: 主人资料（每次对话都会带给 haro）
      responses:
        '200':
          description: 资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [me]
      operationId: replaceProfile
      summary: 整份替换主人资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: 改后的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/home:
    get:
      tags: [me]
      operationId: getHome
      summary: 家的位置（天气用）和节假日的国家
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 家
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [me]
      operationId: replaceHome
      summary: 改家的位置、节假日的国家
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeUpdate'
      responses:
        '200':
          description: 改后的家
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/places:
    get:
      tags: [me]
      operationId: searchPlaces
      summary: 搜地名（只到区 / 市，设家的位置用）
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 候选（最相关的在前）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/countries:
    get:
      tags: [me]
      operationId: listCountries
      summary: 可选的国家（支持节假日的那些；名字按 Accept-Language）
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 国家（按名字排序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: 对话列表（语音那条在最前，其余新的在前；不含删了的）
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 对话
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [conversations]
      operationId: createConversation
      summary: 新建一条对话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: 建好的对话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    delete:
      tags: [conversations]
      operationId: deleteConversation
      summary: 删除（软删除，能恢复；语音那条不能删）
      responses:
        '204':
          description: 删了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/conversations/{conversationId}/restore:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [conversations]
      operationId: restoreConversation
      summary: 恢复删了的对话
      responses:
        '200':
          description: 恢复了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{conversationId}/turns:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [conversations]
      operationId: listTurns
      summary: 往前翻这条对话（一页 page_size 轮，旧的在前）
      parameters:
        - name: before
          in: query
          required: false
          description: 只要编号比它小的（上一页的 next_before）；不带 = 从最新的开始
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 这一页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [conversations]
      operationId: sendMessage
      summary: 说一句（打字）；回答以 Server-Sent Events 流回来
      description: |
        响应是 `text/event-stream`：每个事件一行 `data: <ChatEvent 的 JSON>`，依次是 `started`（带这一轮的 turn_id，停止时用）、
        若干 `text`（回答的文字片段，按顺序拼起来就是 Markdown）、最后 `done` 或 `failed`。
        App 断开后这一轮照样做完、存好（重新打开对话时用 `turns` 翻到）；要停止用 `turns/{turnId}/stop`。
        同一条对话同时只答一句：上一句还在答时回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSend'
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatEvent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/conversations/{conversationId}/turns/{turnId}/stop:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: turnId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    post:
      tags: [conversations]
      operationId: stopTurn
      summary: 停止正在答的这一轮（已经说出来的留着）
      responses:
        '204':
          description: 停了（或者已经答完了）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{conversationId}/attachments:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [conversations]
      operationId: uploadAttachment
      summary: 在这条对话里传一张图片（请求体就是图片；服务端缩到合适的尺寸、存成 JPEG）
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: 存好了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentInfo'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    get:
      tags: [conversations]
      operationId: getAttachment
      summary: 取回一张图片（只能取自己的）
      responses:
        '200':
          description: 图片
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/turns/search:
    get:
      tags: [conversations]
      operationId: searchTurns
      summary: 搜以前的对话（按文字和按意思找到的合在一起，新的在前；删了的对话里的不算）
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: 找到的几轮
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoundTurn'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/memory/backstory:
    get:
      tags: [memory]
      operationId: getBackstory
      summary: 背景记录池（后台从对话整理的「关于主人的背景」，每轮带给 haro）
      responses:
        '200':
          description: 背景记录池
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backstory'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [memory]
      operationId: updateBackstory
      summary: 开、关背景记录池（关了就不带、也不更新）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackstoryUpdate'
      responses:
        '200':
          description: 改后的
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backstory'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/memory/backstory/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    patch:
      tags: [memory]
      operationId: editBackstoryItem
      summary: 改一条（改过的以主人为准，后台整理时不再改、不删）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackstoryItemUpdate'
      responses:
        '200':
          description: 改后的背景记录池
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backstory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [memory]
      operationId: deleteBackstoryItem
      summary: 删一条
      responses:
        '204':
          description: 删了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/memory/notes:
    get:
      tags: [memory]
      operationId: listNotes
      summary: 记过的事（常驻的、一般的；新的在前）和最近忘掉的（找回用）
      responses:
        '200':
          description: 记过的事
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/memory/notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    delete:
      tags: [memory]
      operationId: forgetNote
      summary: 忘掉一条（能找回）
      responses:
        '204':
          description: 忘了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/memory/notes/{noteId}/restore:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      tags: [memory]
      operationId: restoreNote
      summary: 找回忘掉的一条
      responses:
        '200':
          description: 找回了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/research/tasks:
    get:
      tags: [memory]
      operationId: listResearchTasks
      summary: 后台调查（新的在前）
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 调查
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResearchTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/research/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [memory]
      operationId: getResearchTask
      summary: 一个调查：结论（Markdown）和来源
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 调查
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/calendar/occurrences:
    get:
      tags: [calendar]
      operationId: listOccurrences
      summary: 一段时间里的每一次（重复的已经展开；haro 自己的和系统日历同步进来的，开始的先后）
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: 不含；from 到 to 最多 92 天
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 每一次
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Occurrence'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
